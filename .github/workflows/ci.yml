name: CI

on:
  push:
    branches: [main, 'ci/**', 'bench/**']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.10', '3.11', '3.12', '3.13']
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install
        run: pip install -e ".[dev,bench]"

      # why: ruff and mypy read one target-version, both pinned in pyproject.toml, so running
      # them on every cell would repeat one answer four times
      - name: Lint
        if: matrix.python-version == '3.12'
        run: ruff check .

      - name: Types
        if: matrix.python-version == '3.12'
        run: mypy

      - name: Test
        run: pytest -q -n auto

  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Build
        run: |
          pip install build twine
          python -m build

      # inv: the sdist carries the root SKILL.md and README.md only; a path under benchmark/ means the
      # leading-slash anchoring of pyproject's sdist include broke and vendor text is shipping
      - name: Check
        run: |
          twine check dist/*
          if tar tzf dist/*.tar.gz | grep -q 'benchmark/'; then echo "sdist ships benchmark/"; exit 1; fi
          unzip -l dist/*.whl | grep -q 'graphify_search/SKILL.md'
          unzip -l dist/*.whl | grep -q 'graphify_search/py.typed'

  seal:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install
        run: pip install -e ".[dev,bench]"
      # inv: without lock/machine.yaml the check covers the sealed files only, which is what a
      # checkout can prove; an instrument file changed without a matching seal is red here
      - name: Seal
        run: python -m benchmark.harness seal --check
