[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "graphify-search"
version = "0.6.0"
description = "Semantic search layer over graphify knowledge graph for AI coding agents"
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [
    { name = "Ilia Kostenko" }
]
keywords = ["graphify", "knowledge-graph", "semantic-search", "code-search", "ai-agent"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Typing :: Typed",
]
# why: 3.10 must keep installing, as graphifyy itself declares >=3.10; numpy 2.3+ needs 3.11, so a
# resolver picks 2.2.6 on 3.10 and 2.5.x on 3.13+, and 1.26 is a floor low enough for both
dependencies = ["numpy>=1.26"]

[project.urls]
Homepage = "https://github.com/kostenkoia/graphify-search"
Repository = "https://github.com/kostenkoia/graphify-search"
Issues = "https://github.com/kostenkoia/graphify-search/issues"

[project.scripts]
graphify-search = "graphify_search.cli:main"

[project.optional-dependencies]
# NOT DERIVED: the floor buys one sentence-transformers major for everything this extra installs,
# so an index and the queries put to it are embedded by the same loader
local = ["sentence-transformers>=6"]
# why: every tool is bounded by its next major (ruff by its minor, where each release adds rules), so a
# release with new rules or a changed API cannot red a gating CI on an untouched tree
dev = [
    "pyyaml>=6.0,<7",
    "pytest>=8.0,<10",
    "pytest-cov>=5.0,<8",  # why: coverage is read by hand; CI runs the suite through xdist and does not gate on it
    "pytest-xdist>=3.8,<4",
    "ruff>=0.16,<0.17",
    "mypy>=2.3,<3",
]
bench = [
    "pyyaml>=6.0,<7",
    "tiktoken>=0.13,<1",
    "fastmcp>=3.4,<4",
    # why: build_symbols parses .ts/.tsx, which the benchmark instructions tell a reader to run
    "tree-sitter>=0.25,<1",
    "tree-sitter-typescript>=0.23,<1",
]

[tool.hatch.build.targets.wheel]
packages = ["src/graphify_search"]

[tool.hatch.build.targets.wheel.force-include]
"SKILL.md" = "graphify_search/SKILL.md"

[tool.hatch.build.targets.sdist]
# inv: the root files are anchored with a leading slash, or `SKILL.md` and `README.md` also match
# every copy under benchmark/, and the sdist carries vendor text without benchmark/systems/NOTICE.md
include = [
    "src/graphify_search/**/*.py",
    "src/graphify_search/py.typed",
    "/SKILL.md",
    "/README.md",
    "/LICENSE",
    "/pyproject.toml",
]

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = [
    "E",
    "F",
    "W",
    "I",
    "N",
    "UP",
    "D",
    "ANN",
    "B",
    "S",
    "C4",
    "DTZ",
    "RET",
    "SIM",
    "TC",
    "ISC",
    "INP",
    "ERA",
    "ASYNC",
    "ARG",
    "COM812", # why: the other COM rules conflict with the formatter, which this project does not run
    "PT",
    "RUF100",
]
ignore = [
    "D104",   # why: every __init__.py here is empty, so a package docstring would document nothing
    "D105",   # why: a magic method says what it does by its name
    "D107",   # why: numpy style documents __init__ in the class docstring's Parameters section
    "SIM108", # why: an if/else block keeps two branches readable where a ternary would fold them
]
# why: T20 stays off because this is a CLI whose user-facing output goes through print()
# why: PLR2004 stays off because caps and `>= 2 nodes` comparisons are legitimate inline literals

[tool.ruff.lint.pydocstyle]
convention = "numpy"

[tool.ruff.lint.per-file-ignores]
# why: tests are trusted code, not the hostile surface the product guards; they need no
# docstrings/annotations, run subprocesses, set perms, use naive dates and example
# snippets deliberately. PT (pytest-style) stays ON — it is the test-quality gate.
"tests/**" = [
    "D",       # no docstring mandate on tests
    "ANN",     # no annotation mandate on tests
    "ARG",     # fixture/param args are often unused by design
    "S",       # tests legitimately subprocess, assert, set perms, use temp files
    "DTZ",     # test fixtures use naive local dates deliberately
    "ERA001",  # tests carry example/expected code snippets in comments
    "B017",    # tests deliberately assert broad exceptions
]
# why: vendor-authored text, frozen verbatim, is not this project's code
"benchmark/systems/*/docs/scripts/*" = ["ALL"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]
markers = [
    "slow: needs the real embedding model, or spawns multiple subprocesses",
]

[tool.coverage.run]
source = ["graphify_search"]
branch = true

[tool.mypy]

python_version = "3.12"
# inv: the vendor script under benchmark/systems/*/docs/scripts is frozen text, so the benchmark
# roots are named one by one rather than as `benchmark`
files = ["src/graphify_search", "benchmark/harness", "tests/benchmark"]
ignore_missing_imports = true   # why: sentence_transformers, yaml and numpy ship no stubs the checker can use
