adapter: graphify_search
# inv: the version the recorded `version` step must print; `score.records` refuses a run whose
# probe carries any other
# why: this cell runs a wheel built from this repository, so the key tracks its version
version: {cli: "0.6.0"}
invocation:
  # inv: these three name the tool as installed on the machine that runs the benchmark -- the
  # launcher, the Python that runs it, and that Python's site-packages, whose contents are hashed
  # into every ledger row
  # why: they ship as placeholders because no path here can name an installation this repository
  # does not contain; `prepare` refuses with `launcher missing:` while one does not exist
  package:
    launcher: /path/to/your/envs/graphify-search-minilm/bin/graphify-search
    interpreter: /path/to/your/envs/graphify-search-minilm/bin/python
    site: /path/to/your/envs/graphify-search-minilm/lib/python3.14/site-packages
  subcommands:
    query:     {positional: 1, flags: {-k: {type: int}, --budget: {type: int}, --require-dense: {}, --no-snippets: {}, --no-edges: {}}, rejected: [--graph, --endpoint, --model]}
    --version: {positional: 0, flags: {}}
  rejected_subcommands: [index, status, install, uninstall, detect, --help]
fixed_steps:
  - {name: version, argv: [graphify-search, --version], quote: null, system_call: true}
  - {name: query, argv: [graphify-search, query, "<question>", --require-dense], quote: "graphify-search query \"<the user's question, verbatim>\"", system_call: true, ceiling_call: true}
# NOT DERIVED: the tool states no budget of calls; five matches the two systems beside it
ceiling: {quote: null, source: null, kind: owner, calls: 5}
default_configuration: minilm
configurations: {minilm: {index: indexes/graphify-search-minilm, search_mode: [dense]}}
sandbox_layout: {graphify-out: "<artifacts>"}
# why: the child inherits nothing but this map, so the embedder the run used is on record; the
# endpoint names no URL, which is what selects the in-process model over an HTTP one
# inv: the weights are the ones `models` below pins, copied into the sandbox home, and the offline
# flags keep a missing file a refusal rather than a download
environment: {PATH: "/usr/bin:/bin", LANG: "C.UTF-8", NO_PROXY: "*", GRAPHIFY_SEARCH_ENDPOINT: "local", GRAPHIFY_SEARCH_MODEL: "sentence-transformers/all-MiniLM-L6-v2", HF_HUB_OFFLINE: "1", TRANSFORMERS_OFFLINE: "1", HF_HUB_DISABLE_PROGRESS_BARS: "1", HF_HUB_DISABLE_TELEMETRY: "1", TQDM_DISABLE: "1"}
