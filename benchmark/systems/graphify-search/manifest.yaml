id: graphify-search
kind: own
package: graphify-search
version_seen: 0.6.0
sources:
  homepage: https://github.com/kostenkoia/graphify-search
  shipped_skill: SKILL.md
prescribed_workflow:
  source: "SKILL.md § 'Ask'"
  steps:
    - id: 1
      name: query
      quote: "graphify-search query \"<the user's question, verbatim>\""
      command: 'graphify-search query "<question>" --require-dense'
      note: the question is passed as the user wrote it; no expansion step exists
# why: the recipe is one call and the call budget is this harness's own cap (SKILL.md states
# none), so nothing here departs from what SKILL.md prescribes; the key is kept as an empty list rather than dropped, so a later
# departure has a place to be written down instead of being made silently
deviations: []

properties:
  # inv: records path and start line only, never an end line, so the adapter records no end
  granularity: symbol_point
  ranked: cosine similarity rounded to three decimals, ties by path then start
  deterministic: >-
    asserted by measurement, not by construction: the query embedding comes from a server, so
    stability is what a second baseline attempt of the same question shows and nothing else can;
    the server's weights are not hashed by the harness, only named, so which embedder answered
    rests on the `reported.embedder` note in the index's build.yaml.
    BM25 mode is deterministic by construction
  budget: 6000 characters over the results array; the ladder drops snippet, edges, then k
