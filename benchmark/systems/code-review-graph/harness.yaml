adapter: code_review_graph
# inv: the version the recorded `version` step must print; `score.records` refuses a run whose
# probe carries any other
# why: this is the vendor release the docs below were frozen from, so a different installation
# needs both this key and those hashes rewritten -- an older document authorises no quote of a
# newer one
version: {cli: "2.3.7"}
invocation:
  # inv: these three name the tool as installed on the machine that runs the benchmark -- the
  # launcher, the Python that runs it, and that Python's site-packages, whose contents are hashed
  # into every ledger row
  # why: they ship as placeholders because no path here can name an installation this repository
  # does not contain; `prepare` refuses with `launcher missing:` while one does not exist
  package:
    launcher: /path/to/your/envs/code-review-graph/bin/code-review-graph
    interpreter: /path/to/your/envs/code-review-graph/bin/python
    site: /path/to/your/envs/code-review-graph/lib/python3.14/site-packages
  subcommands:
    --version: {positional: 0, flags: {}}
  # inv: `serve` is started by mcp.py, never through check_call
  rejected_subcommands: [build, embed, serve, --help]
  tools:
    get_minimal_context_tool:   {keys: {task: {literal_prefix: ["debug: "]}}, rejected: [repo_root, base, changed_files]}
    semantic_search_nodes_tool: {keys: {query: {}, detail_level: {literal: [minimal, standard], source: "our restriction: debug_prompt.md rule 3 also permits verbose, which tools/query.py treats identically to standard since it branches only on minimal; the recipe calls with standard"}, limit: {literal: [5], source: "debug recipe step 2"}}, rejected: [repo_root, kind, model, provider]}
    list_graph_stats_tool:      {keys: {}, rejected: [repo_root]}
fixed_steps:
  - {name: version, argv: [code-review-graph, --version], quote: null, system_call: true}
  - {name: minimal_context, tool: get_minimal_context_tool, args: {task: "debug: <question>"}, quote: "ALWAYS call `get_minimal_context` first", system_call: true, ceiling_call: true}
  # why: standard rather than the prescribed minimal, which keeps only name/kind/file_path/score
  # (tools/query.py) and so could yield no `place` at all; manifest.yaml records the departure
  - {name: search, tool: semantic_search_nodes_tool, args: {query: "<expansion>", detail_level: standard, limit: 5}, quote: "semantic_search_nodes", system_call: true, ceiling_call: true}
# why: the numbers are the vendor's own, taken from the quoted sentence into fields so the
# harness can hold a run to them instead of reading prose; `calls` is what a run is stopped
# at, `output_tokens` is recorded only, because the vendor's own prescribed recipe can already
# exceed it, and enforcing it would forbid the workflow being measured
ceiling: {quote: "≤5 tool calls and ≤800 total output tokens", source: docs/skill.md, kind: target,
          calls: 5, output_tokens: 800}
default_configuration: vector
configurations:
  vector:  {index: indexes/code-review-graph-vector, search_mode: [semantic, hybrid]}
  keyword: {index: indexes/code-review-graph, search_mode: [keyword, fts], status: declared}
sandbox_layout: {.code-review-graph: "<artifacts>"}
environment:
  PATH: "/usr/bin:/bin"
  LANG: "C.UTF-8"
  NO_PROXY: "*"
  HF_HUB_OFFLINE: "1"
  TRANSFORMERS_OFFLINE: "1"
  HF_HUB_DISABLE_PROGRESS_BARS: "1"
  HF_HUB_DISABLE_TELEMETRY: "1"
  HF_HUB_DISABLE_IMPLICIT_TOKEN: "1"
  TQDM_DISABLE: "1"
  CRG_DATA_DIR: "<sandbox>/.code-review-graph"
